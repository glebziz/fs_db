name: test

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: |
          go test --tags=test ./internal/... -coverprofile=coverage.txt.tmp

      - name: Filter coverage
        run: |
           cat coverage.txt.tmp | grep -v -e "pb.go" -e "mocks" -e "internal/app/" -e "internal/db/" > coverage.txt && rm coverage.txt.tmp

      - name: Upload code coverage
        uses: codecov/codecov-action@v3
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify dependencies
        run: go mod verify

      - name: Run inline tests
        run: |
          go test -count=1 --tags=inline ./pkg/test/...
