syntax = "proto3";

package store;

option go_package = "fs_fb/proto/store";

enum ChunkSize {
  EMPTY = 0;
  MAX = 2048;
}

service StoreV1 {
  rpc SetFile(stream SetFileRequest) returns(SetFileResponse) {}
  rpc GetFile(GetFileRequest) returns(stream GetFileResponse) {}

  rpc SetFileV2(stream SetFileV2Request) returns(SetFileV2Response) {}
  rpc GetFileV2(stream GetFileV2Request) returns(stream GetFileV2Response) {}

  rpc GetKeys(GetKeysRequest) returns(GetKeysResponse) {}
  rpc DeleteFile(DeleteFileRequest) returns(DeleteFileResponse) {}

  // Tx
  rpc BeginTx(BeginTxRequest) returns(BeginTxResponse) {}
  rpc CommitTx(CommitTxRequest) returns(CommitTxResponse) {}
  rpc RollbackTx(RollbackTxRequest) returns(RollbackTxResponse) {}
}

enum TxIsoLevel {
  ISO_LEVEL_READ_UNCOMMITTED = 0;
  ISO_LEVEL_READ_COMMITTED = 1;
  ISO_LEVEL_REPEATABLE_READ = 2;
  ISO_LEVEL_SERIALIZABLE = 3;
}

message FileHeader {
  string key = 1;
  uint64 size = 2 [deprecated = true];
}

message Seek {
  int64 offset = 1;
  Direction dir = 2;

  enum Direction {
    SeekStart   = 0;
    SeekCurrent = 1;
    SeekEnd     = 2;
  }
}

message DataChunk {
  bytes chunk = 1;
  Seek pos = 2;
}

message SetFileRequest {
  oneof data {
    FileHeader header = 1;
    bytes chunk = 2;
  }
}

message SetFileResponse {}

message GetFileRequest {
  string key = 1;
}

message GetFileResponse {
  oneof data {
    bytes chunk = 1;
    FileHeader header = 2;
  }
}

message SetFileV2Request {
  oneof data {
    FileHeader header = 1;
    DataChunk chunk = 2;
  }
}

message SetFileV2Response {}

message GetFileV2Request {
  oneof data {
    FileHeader header = 1;
    Seek pos = 2;
  }
}

message GetFileV2Response {
  oneof data {
    int64 size = 1;
    bytes chunk = 2;
  }
}

message GetKeysRequest {}

message GetKeysResponse {
  repeated string keys = 1;
}

message DeleteFileRequest {
  string key = 1;
}

message DeleteFileResponse {}

message BeginTxRequest {
  TxIsoLevel isoLevel = 1;
}

message BeginTxResponse {
  string id = 1;
}

message CommitTxRequest {}

message CommitTxResponse {}

message RollbackTxRequest {}

message RollbackTxResponse {}
